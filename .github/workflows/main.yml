name: Deploy

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux
          - build: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - build: linux-i686
            os: ubuntu-latest
            target: i686-unknown-linux-gnu
          - build: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu

          # Windows
          - build: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - build: windows-i686
            os: windows-latest
            target: i686-pc-windows-msvc
          - build: windows-aarch64
            os: windows-latest
            target: aarch64-pc-windows-msvc

          # macOS
          - build: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - build: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Get version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          override: true
          target: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Create release directory
        run: mkdir -p release

      - name: Move binary to release
        run: |
          ext=""
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            ext=".exe"
          fi
          BIN_NAME="cs2d-parser-${{ matrix.build }}${ext}"
          mv target/${{ matrix.target }}/release/cs2d-parser${ext} release/$BIN_NAME
        shell: bash

      - name: Generate SHA256 checksum
        run: |
          cd release
          > checksums.txt
          for f in cs2d-parser-*; do
            sha256sum "$f" >> checksums.txt
          done
          sort -o checksums.txt checksums.txt
        shell: bash

      - name: List release files
        run: ls -l release

      - name: Upload binaries and checksums to GitHub Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          file: ./release/*
          file_glob: true

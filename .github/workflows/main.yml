name: Deploy

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: cs2d-parser

jobs:
  build-and-upload:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - build: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: ${{ env.BIN_NAME }}-linux-x86_64
          - build: linux-i686
            os: ubuntu-latest
            target: i686-unknown-linux-gnu
            artifact_name: ${{ env.BIN_NAME }}-linux-i686
          - build: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: ${{ env.BIN_NAME }}-linux-aarch64

          # Windows
          - build: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ${{ env.BIN_NAME }}-windows-x86_64.exe
          - build: windows-i686
            os: windows-latest
            target: i686-pc-windows-msvc
            artifact_name: ${{ env.BIN_NAME }}-windows-i686.exe
          - build: windows-aarch64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact_name: ${{ env.BIN_NAME }}-windows-aarch64.exe

          # macOS
          - build: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: ${{ env.BIN_NAME }}-macos-x86_64
          - build: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: ${{ env.BIN_NAME }}-macos-aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          override: true
          target: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare release directory
        run: mkdir -p release

      - name: Rename and move binary
        shell: bash
        run: |
          mv "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}"{${{ matrix.os == 'windows-latest' && '.exe' || '' }},"" } "release/${{ matrix.artifact_name }}"

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd release
          sha256sum * > checksums.txt
          sort -o checksums.txt checksums.txt
          cat checksums.txt

      - name: List release files
        run: ls -lh release

      - name: Upload binaries and checksums to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            **Changelog for ${{ steps.version.outputs.version }}**
            - [See commits](https://github.com/ernestpasnik/cs2d-parser/compare/${{ github.event.before }}...${{ github.ref }})
          files: |
            release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
